<style>
/* Concept: a quiet green workbench. Top bar with tabs, a website view, two phones side by side with a money panel, and an admin payout desk. */
:root {
  --bg: #edf3ef;
  --surface: #ffffff;
  --surface2: #f5f9f6;
  --fg: #15231d;
  --muted: #55665e;
  --line: #d6e1db;
  --brand: #0d6a55;
  --brand-fg: #ffffff;
  --brand-soft: #daeee6;
  --amber: #8f5c00;
  --amber-soft: #fbefd0;
  --red: #b3261e;
  --red-soft: #fbe2df;
  --ok: #17753f;
  --ok-soft: #dbf1e3;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1613; --surface: #16211d; --surface2: #1b2924; --fg: #e5efea; --muted: #94a79e;
    --line: #2a3b34; --brand: #45b898; --brand-fg: #052219; --brand-soft: #1a3a30;
    --amber: #e8b94c; --amber-soft: #3a2f12; --red: #ff8f86; --red-soft: #3e201d;
    --ok: #62d392; --ok-soft: #173a29; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1613; --surface: #16211d; --surface2: #1b2924; --fg: #e5efea; --muted: #94a79e;
  --line: #2a3b34; --brand: #45b898; --brand-fg: #052219; --brand-soft: #1a3a30;
  --amber: #e8b94c; --amber-soft: #3a2f12; --red: #ff8f86; --red-soft: #3e201d;
  --ok: #62d392; --ok-soft: #173a29; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.12; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.wrap { max-width: 1140px; margin: 0 auto; }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 14px 0; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 20px; }
.logo-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--brand); display: grid; place-items: center; }
.logo-mark svg { width: 18px; height: 18px; }
.tag { font-size: 12px; color: var(--muted); }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-left: auto; }
.tabs button { border: 0; background: transparent; padding: 8px 14px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.tabs button[aria-current="true"] { background: var(--brand); color: var(--brand-fg); }
.reset { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-weight: 600; color: var(--muted); }

/* guide bar */
.guide { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--brand-soft); border-radius: 12px; padding: 12px 16px; margin: 4px 0 20px; }
.guide b { font-family: var(--font-display); }
.guide .step { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--brand); }

/* apps layout */
.apps { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.phone-col { display: flex; flex-direction: column; gap: 10px; align-items: center; width: min(360px, 100%); }
.phone-label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.phone { width: 100%; height: 700px; border: 8px solid #1a2420; border-radius: 38px; background: var(--surface); overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 18px 40px rgba(0,0,0,.14); }
.sbar { display: flex; justify-content: space-between; padding: 8px 20px 4px; font-size: 11px; font-weight: 700; color: var(--muted); }

.back { border: 0; background: var(--surface2); width: 30px; height: 30px; border-radius: 9px; font-weight: 700; }
.scr { flex: 1; overflow-y: auto; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.side { flex: 1; min-width: min(300px, 100%); display: flex; flex-direction: column; gap: 16px; }

/* shared parts */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.panel h3 { font-size: 17px; margin-bottom: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-fg); }
.btn { border: 0; background: var(--brand); color: var(--brand-fg); border-radius: 12px; padding: 12px 16px; font-weight: 700; width: 100%; }
.btn.ghost { background: var(--surface2); color: var(--fg); border: 1px solid var(--line); }
.btn.danger { background: var(--red); color: #fff; }
.btn.small { width: auto; padding: 8px 12px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: .5; cursor: default; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 3px 8px; background: var(--brand-soft); color: var(--brand); white-space: nowrap; }
.pill.amber { background: var(--amber-soft); color: var(--amber); }
.pill.red { background: var(--red-soft); color: var(--red); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.lbl { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; display: block; }
input[type="text"], textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 10px 12px; font: inherit; }
textarea { min-height: 64px; resize: vertical; }
.card { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.wk { display: flex; gap: 12px; align-items: center; }
.av { width: 44px; height: 44px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; flex: none; }
.wk .nm { font-weight: 700; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
.kv.total { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 8px; font-weight: 800; }
.note { background: var(--amber-soft); color: var(--amber); border-radius: 10px; padding: 8px 10px; font-size: 13px; font-weight: 600; }
.note.red { background: var(--red-soft); color: var(--red); }
.note.ok { background: var(--ok-soft); color: var(--ok); }
.stars { display: flex; gap: 4px; }
.stars button { border: 0; background: transparent; font-size: 26px; padding: 0 2px; color: var(--line); }
.stars button[aria-pressed="true"] { color: #e0a000; }
.dots span { display: inline-block; width: 8px; height: 8px; margin-right: 4px; border-radius: 50%; background: var(--brand); animation: pulse 1.2s infinite ease-in-out; }
.dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }

.map { border: 1px solid var(--line); border-radius: 14px; background: var(--surface2); }
.map svg { display: block; width: 100%; height: auto; }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; }
.log li { display: flex; gap: 10px; font-size: 13px; }
.log time { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.ledger .kv { font-variant-numeric: tabular-nums; }

/* admin */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 20px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.tile .v { font-family: var(--font-display); font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tile .l { font-size: 13px; color: var(--muted); }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 620px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: middle; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
td input { width: 140px; padding: 7px 9px; }
.checks { display: flex; gap: 4px; flex-wrap: wrap; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }

/* website */
.hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: 32px; align-items: center; padding: 28px 0 40px; }
.hero h1 { font-size: clamp(34px, 6vw, 58px); font-weight: 800; letter-spacing: -.02em; }
.hero p.lead { font-size: 18px; color: var(--muted); margin: 16px 0 24px; max-width: 52ch; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; }
.cta .btn { width: auto; padding: 14px 20px; }
.hero-card { background: var(--brand); color: var(--brand-fg); border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
.hero-card .row { background: rgba(255,255,255,.12); border-radius: 14px; padding: 12px 14px; }
.sec { padding: 34px 0; border-top: 1px solid var(--line); }
.sec h2 { font-size: clamp(26px, 4vw, 36px); margin-bottom: 8px; }
.sec .intro { color: var(--muted); max-width: 60ch; margin-bottom: 22px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.grid3 .panel h3 { margin-bottom: 6px; }
.ctab { width: 100%; border-collapse: collapse; min-width: 0; }
.footer { padding: 28px 0 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px); }

/* admin dashboard */
.adm { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 20px; align-items: start; }
.snav { display: flex; flex-direction: column; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px; position: sticky; top: 12px; }
.snav button { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 0; background: transparent; padding: 9px 12px; border-radius: 9px; text-align: left; font-weight: 600; color: var(--muted); }
.snav button[aria-current="true"] { background: var(--brand-soft); color: var(--brand); }
.badge { min-width: 20px; text-align: center; font-size: 11px; font-weight: 800; border-radius: 999px; padding: 1px 7px; background: var(--red); color: #fff; }
.badge.n { background: var(--surface2); color: var(--muted); }
.att { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.att li { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bigmap { border: 1px solid var(--line); border-radius: 14px; background: var(--surface2); overflow: hidden; }
.bigmap svg { display: block; width: 100%; height: auto; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding: 8px 12px; }
.amt-in { color: var(--ok); font-weight: 700; }
.amt-out { color: var(--red); font-weight: 700; }
.plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.plan { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.plan.on { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
.plan ul { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
.plan .pr { font-family: var(--font-display); font-weight: 800; font-size: 24px; }
button.pill { border: 0; cursor: pointer; }
.mem { margin-left: auto; }
@media (max-width: 860px) {
  .adm { grid-template-columns: 1fr; }
  .snav { flex-direction: row; overflow-x: auto; position: static; }
  .snav button { white-space: nowrap; }
}
@media (max-width: 760px) {
  .hero { grid-template-columns: 1fr; }
  .tabs { margin-left: 0; width: 100%; }
  .tabs button { flex: 1; padding: 8px 6px; }
  .phone { height: 660px; }
}
@media (prefers-reduced-motion: reduce) { .dots span { animation: none; opacity: 1; } }
</style>

<script>

const sampleActive = () => [

const sampleTx = () => {
  const rows = [

let state, timer = null, clock = 0, toastTimer = null;

});
const worker = (id) => WORKERS.find((w) => w.id === id);
const r2 = (n) => Math.round(n * 100) / 100;
const K = (n) => "K" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const stamp = () => { clock += 2; return pad(14 + Math.floor(clock / 60)) + ":" + pad(clock % 60); };
const say = (t) => state.log.unshift({ t: stamp(), m: t });
const txAdd = (ref, type, party, amt, status) => state.tx.unshift({ t: stamp(), ref, type, party, amt, status });
const money = (rate, hours) => { const price = rate * hours, safety = r2(price * 0.03); return { price, safety, total: r2(price + safety), worker: r2(price * 0.9), commission: r2(price * 0.1) }; };
const initials = (n) => n.split(" ").map((p) => p[0]).join("");
const $ = (s) => document.querySelector(s);

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}

/* ---------- actions ---------- */
function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
function startTrip() {
  const b = state.booking, w = worker(b.wid);
  state.track = { d: w.km, d0: w.km };
  b.status = "enroute"; say(w.name + " accepted and is on the way.");
  stopTimer();
  timer = setInterval(() => {
    const t = state.track; t.d = Math.max(0, t.d - t.d0 / 14);
    if (t.d <= 0.02) { t.d = 0; b.status = "arrived"; stopTimer(); say(w.name + " has arrived."); }
    render();
  }, 700);
}
function act(a, v) {
  const c = state.cust, b = state.booking;
  switch (a) {
    case "tab": state.tab = v; break;
    case "reset": stopTimer(); clock = 0; state = fresh(); state.tab = "apps"; break;
    case "svc": state.service = v; break;
    case "pick": c.wid = v; c.screen = "book"; c.special = false; c.specialText = ""; break;
    case "back": c.screen = c.screen === "pay" ? "book" : b && b.status !== "declined" && c.screen === "member" ? "status" : "home"; break;
    case "when": c.when = v; break;
    case "hours": c.hours = Number(v); break;
    case "special": c.special = !c.special; break;
    case "topay": c.screen = "pay"; break;
    case "pay": {
      c.paying = true; render();
      setTimeout(() => {
        const w = worker(c.wid), rate = RATE[state.service], m = money(rate, c.hours);
        state.booking = { wid: c.wid, service: state.service, hours: c.hours, rate, ...m, when: c.when, address: c.address, notes: c.notes, special: c.special, specialText: c.specialText, status: "awaiting", complaint: false, rating: 5, checkIn: null, priority: state.member !== "basic" };
        c.paying = false; c.screen = "status";
        say("Customer paid " + K(m.total) + " in the app. HomeTrust is holding it.");
        txAdd("B-2051", "Customer payment", DEMO_CLIENT.name, m.total, "Held");
        say("Request sent to " + w.name + ".");
        render();
      }, 1200);
      return;
    }
    case "cancel": say("Customer cancelled before acceptance. " + K(b.total) + " refunded."); txAdd("B-2051", "Refund", DEMO_CLIENT.name, b.total, "Refunded"); state.booking = null; c.screen = "home"; break;
    case "decline": say(worker(b.wid).name + " declined. " + K(b.total) + " refunded to the customer."); txAdd("B-2051", "Refund", DEMO_CLIENT.name, b.total, "Refunded"); b.status = "declined"; break;
    case "accept": startTrip(); return render();
    case "checkin": b.status = "inprogress"; b.checkIn = true; say("Checked in at the customer's address (test location)."); break;
    case "checkout": b.status = "confirm"; say(worker(b.wid).name + " checked out. Waiting for the customer to confirm."); break;
    case "sos": case "problem": {
      if (!b.complaint) {
        const sos = a === "sos";
        state.complaints.unshift({ id: "C-" + (302 + state.complaints.length), job: "J-1045", client: DEMO_CLIENT.name, worker: worker(b.wid).name, type: sos ? "SOS" : "Complaint", text: sos ? "SOS pressed during the visit." : "Problem reported during the visit.", status: "open" });
      }
      b.complaint = true;
      say(a === "sos" ? "SOS sent to the HomeTrust desk. Payout for this job is on hold." : "Complaint raised. Payout for this job is on hold.");
      break;
    }
    case "star": b.rating = Number(v); break;
    case "confirm": {
      b.status = "done";
      state.jobs.push({ id: "J-1045", wid: b.wid, worker: worker(b.wid).name, client: DEMO_CLIENT.name, service: b.service, hours: b.hours, price: b.price, status: b.complaint ? "hold" : "ready" });
      txAdd("J-1045", "Commission", "HomeTrust", b.commission, "Earned");
      txAdd("J-1045", "Safety contribution", "HomeTrust", b.safety, "Earned");
      say("Customer confirmed the job and rated " + b.rating + " stars.");
      say(b.complaint ? "Payout held until the complaint is resolved." : "Job added to tonight's payout list.");
      break;
    }
    case "again": state.booking = null; c.screen = "home"; break;
    case "resolve": {
      const j = state.jobs.find((x) => x.id === v); if (j) j.status = "ready";
      state.complaints.filter((x) => x.job === v).forEach((x) => { x.status = "resolved"; });
      if (b && v === "J-1045") b.complaint = false;
      say("Complaint on " + v + " resolved. Payout released to tonight's list.");
      break;
    }
    case "adm": state.admin = v; break;
    case "gopay": state.tab = "admin"; state.admin = "payouts"; break;
    case "txf": state.txf = v; break;
    case "memscr": c.screen = "member"; break;
    case "join": {
      if (v === "basic") { state.member = "basic"; say("Membership cancelled. Back on Basic."); break; }
      const p = PLANS[v]; state.member = v;
      say("Customer joined " + p.name + " (" + K(p.price) + " per month).");
      txAdd("MEM-0415", "Membership", DEMO_CLIENT.name + " (" + p.name + ")", p.price, "Active");
      toast("Welcome to " + p.name + ". Simulated payment, no money moved.");
      break;
    }
    case "payout": {
      const ref = (state.refs[v] || "").trim();
      if (!ref) { toast("Enter the mobile money reference first."); return; }
      const rows = state.jobs.filter((j) => j.wid === v && j.status === "ready");
      const sum = rows.reduce((s, j) => s + r2(j.price * 0.9), 0);
      rows.forEach((j) => { j.status = "paid"; j.ref = ref; });
      say("Paid " + worker(v).name + " " + K(sum) + " (ref " + ref + ").");
      txAdd(ref, "Worker payout", worker(v).name, sum, "Paid");
      toast("Payout recorded for " + worker(v).name + ".");
      break;
    }
    case "photo": state.photoPending = false; state.photoDone = v; toast(v === "ok" ? "New photo approved." : "Photo change rejected. The old photo stays."); break;
    case "cta": toast("Prototype only. The Google Play link goes live at launch."); return;
  }
  render();
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]"); if (t && !t.disabled) act(t.dataset.act, t.dataset.v);
});
document.addEventListener("input", (e) => {
  const id = e.target.id, c = state.cust;
  if (id === "addr") c.address = e.target.value;
  if (id === "notes") c.notes = e.target.value;
  if (id === "sptext") c.specialText = e.target.value;
  if (id === "momo") c.momo = e.target.value;
  if (id && id.startsWith("ref-")) state.refs[id.slice(4)] = e.target.value;
});

/* ---------- guide ---------- */
function guide() {
  const b = state.booking;
  const g = (n, text, go, label) => `<div class="guide"><span class="step">Step ${n} of 8</span><span><b>${text}</b></span>${go ? `<button class="btn ghost small" data-act="gopay">${label}</button>` : ""}</div>`;
  if (!b) return g(1, "In the customer phone, choose a worker (nearest first) and book. Tap the plan badge at the top to try Membership.");
  if (b.status === "declined") return g(2, "The worker declined and the payment was refunded. Pick another worker in the customer phone.");
  if (b.status === "awaiting") return g(2, "In the worker phone, accept or decline the request.");
  if (b.status === "enroute") return g(3, "The worker is on the way. The customer follows the distance and arrival time live.");
  if (b.status === "arrived") return g(4, "The worker has arrived. In the worker phone, tap Check in.");
  if (b.status === "inprogress") return g(5, "Visit in progress. Tap Check out, or try SOS in the customer phone to see the payout hold.");
  if (b.status === "confirm") return g(6, "The worker checked out. In the customer phone, confirm the job and rate.");
  const paid = state.jobs.some((j) => j.id === "J-1045" && j.status === "paid");
  if (!paid) return g(7, "Job complete. In Admin, open Payouts and pay the worker. Also look at Live jobs, Transactions and Memberships.", "admin", "Open Payouts");
  return g(8, "Paid out. Reset to run the demo again.");
}

/* ---------- customer phone ---------- */
function breakdown(m, rate, hours) {
  return `<div class="card">
    <div class="kv"><span>Service (${hours} h × K${rate})</span><span>${K(m.price)}</span></div>
    <div class="kv"><span>Trust &amp; Safety contribution (3%)</span><span>${K(m.safety)}</span></div>
    <div class="kv total"><span>You pay</span><span>${K(m.total)}</span></div></div>`;
}
function stars(rating, interactive) {
  return `<div class="stars" role="group" aria-label="Rating">${[1, 2, 3, 4, 5].map((n) => `<button ${interactive ? `data-act="star" data-v="${n}"` : "disabled"} aria-pressed="${n <= rating}" aria-label="${n} stars">★</button>`).join("")}</div>`;
}
function mapView(t, name) {
  const eta = Math.max(1, Math.ceil(t.d / 0.4));
  return `<div class="map"><svg viewBox="0 0 300 170" role="img" aria-label="Map showing ${esc(name)} approaching">
    <g stroke="var(--line)" stroke-width="1"><path d="M0 40H300M0 90H300M0 135H300M50 0V170M120 0V170M200 0V170M260 0V170"/></g>
    <path class="route" d="M24 142 C 80 142, 90 82, 150 82 S 235 52, 268 40" fill="none" stroke="var(--brand)" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/>
    <circle cx="268" cy="40" r="9" fill="var(--red)"/><circle cx="268" cy="40" r="3.5" fill="#fff"/>
    <circle class="wdot" cx="24" cy="142" r="9" fill="var(--brand)" stroke="#fff" stroke-width="2.5" data-p="${(1 - t.d / t.d0).toFixed(3)}"/>
  </svg></div>
  <div class="row"><div><div class="lbl">Distance</div><b>${t.d.toFixed(1)} km</b></div><div><div class="lbl">Arrives in</div><b>${t.d === 0 ? "Arrived" : eta + " min"}</b></div></div>
  <p class="small muted">Demo speed. Tracking is shown only for this booking.</p>`;
}
function customerPhone() {
  const c = state.cust, b = state.booking;
  let title = "Find help", sub = "Kabulonga, Lusaka", body = "", back = false;
  if (c.screen === "home" || (c.screen === "status" && !b)) {
    const list = WORKERS.filter((w) => w.services.includes(state.service)).sort((x, y) => x.km - y.km);
    body = `<div class="chips" role="group" aria-label="Service">${Object.keys(RATE).map((s) => `<button class="chip" data-act="svc" data-v="${s}" aria-pressed="${state.service === s}">${LABEL[s]}</button>`).join("")}</div>
      <p class="small muted">Verified workers for ${LABEL[state.service].toLowerCase()}, nearest first.</p>
      ${list.map((w) => `<div class="card"><div class="wk"><div class="av">${initials(w.name)}</div><div style="min-width:0"><div class="nm">${w.name}</div>
        <div class="small muted">★ ${w.rating} · ${w.jobs} jobs · ${w.area}</div></div></div>
        <div class="row"><div><span class="pill ok">✓ Verified</span> <span class="small"><b>${w.km.toFixed(1)} km</b> away</span></div><span class="small"><b>K${RATE[state.service]}</b>/h</span></div>
        <button class="btn" data-act="pick" data-v="${w.id}">Book ${w.name.split(" ")[0]}</button></div>`).join("")}`;
  } else if (c.screen === "book") {
    const w = worker(c.wid), rate = RATE[state.service], m = money(rate, c.hours), care = CARE.includes(state.service);
    title = "Book " + w.name.split(" ")[0]; sub = LABEL[state.service] + " · " + w.km.toFixed(1) + " km away"; back = true;
    body = `<div><span class="lbl">When</span><div class="chips">${Object.entries(WHEN).map(([k, l]) => `<button class="chip" data-act="when" data-v="${k}" aria-pressed="${c.when === k}">${l}</button>`).join("")}</div></div>
      <div><span class="lbl">How long</span><div class="chips">${[3, 4, 5, 6, 8].map((h) => `<button class="chip" data-act="hours" data-v="${h}" aria-pressed="${c.hours === h}">${h} hours</button>`).join("")}</div></div>
      <div><label class="lbl" for="addr">Address</label><input type="text" id="addr" value="${esc(c.address)}"></div>
      <div><label class="lbl" for="notes">Instructions for the worker</label><textarea id="notes" placeholder="Anything the worker should know">${esc(c.notes)}</textarea></div>
      ${care ? `<div class="card"><button class="chip" data-act="special" aria-pressed="${c.special}">${c.special ? "✓ " : ""}Someone with special needs</button>
        ${c.special ? `<label class="lbl" for="sptext">What is needed</label><textarea id="sptext" placeholder="For example: needs help with medication at noon">${esc(c.specialText)}</textarea>` : `<p class="small muted">Tick this so the worker knows before accepting.</p>`}</div>` : ""}
      ${breakdown(m, rate, c.hours)}
      <button class="btn" data-act="topay">Continue to payment</button>`;
  } else if (c.screen === "pay") {
    const m = money(RATE[state.service], c.hours); title = "Pay"; sub = "Held by HomeTrust until the job is done"; back = true;
    body = `${breakdown(m, RATE[state.service], c.hours)}
      <div><label class="lbl" for="momo">Mobile money number</label><input type="text" id="momo" inputmode="tel" placeholder="097 000 0000" value="${esc(c.momo)}"></div>
      <div class="note">Simulated payment. No money moves in this prototype.</div>
      <button class="btn" data-act="pay" ${c.paying ? "disabled" : ""}>${c.paying ? "Waiting for approval on your phone..." : "Pay " + K(m.total)}</button>`;
  } else if (c.screen === "member") {
    title = "Membership"; sub = "Optional. Cancel any time."; back = true;
    const plan = (k) => { const p = PLANS[k], on = state.member === k;
      return `<div class="plan ${on ? "on" : ""}"><div class="row"><b>${p.name}</b>${on ? `<span class="pill ok">Your plan</span>` : ""}</div>
        <div class="pr">${p.price ? "K" + p.price : "Free"}<span class="small muted">${p.price ? " / month" : ""}</span></div>
        <ul>${p.perks.map((x) => `<li>${x}</li>`).join("")}</ul>

    body = `<p class="small muted">Membership is optional. It does not include free labour. You still pay for each service and the 3% contribution.</p>${plan("basic")}${plan("plus")}${plan("premium")}

    const held = `<div class="note ok">${K(b.total)} paid and held by HomeTrust</div>`;

  return `<div class="phone-col"><div class="phone"><div class="sbar"><span>14:00</span><span>Customer</span></div>

/* ---------- worker phone ---------- */
function workerPhone() {
  const b = state.booking, w = b ? worker(b.wid) : WORKERS[0];
  const mine = state.jobs.filter((j) => j.wid === w.id);
  const sum = (st) => mine.filter((j) => j.status === st).reduce((s, j) => s + r2(j.price * 0.9), 0);
  let body = "", sub = "You are online";
  if (b && b.status === "awaiting") {
    sub = "New request";
    body = `<div class="card"><div class="row"><b>${LABEL[b.service]} · ${b.hours} hours</b><span class="pill amber">${worker(b.wid).km.toFixed(1)} km</span></div>
      ${b.priority ? `<div><span class="pill ok">★ Priority request (member)</span></div>` : ""}
      <div class="kv"><span>When</span><span>${WHEN[b.when]}</span></div>
      <div class="kv"><span>Area</span><span>Kabulonga</span></div>
      <div class="kv total"><span>You earn</span><span>${K(b.worker)}</span></div>
      <p class="small muted">90% of ${K(b.price)}. The exact address is shown after you accept.</p></div>
      ${b.special ? `<div class="note">Special needs: ${esc(b.specialText || "details not given")}</div>` : ""}
      ${b.notes ? `<div class="card"><span class="lbl">Instructions</span><p>${esc(b.notes)}</p></div>` : ""}
      <button class="btn" data-act="accept">Accept</button><button class="btn ghost" data-act="decline">Decline</button>`;
  } else if (b && (b.status === "enroute" || b.status === "arrived" || b.status === "inprogress" || b.status === "confirm") && b.wid === w.id) {
    sub = "Active job";
    const addr = `<div class="card"><span class="lbl">Address</span><p>${esc(b.address)}</p>${b.notes ? `<span class="lbl">Instructions</span><p>${esc(b.notes)}</p>` : ""}${b.special ? `<div class="note">Special needs: ${esc(b.specialText || "details not given")}</div>` : ""}</div>`;
    if (b.status === "enroute") body = `${addr}${mapView(state.track, "the customer")}<p class="small muted">Head to the address. The customer can see you approaching.</p>`;
    else if (b.status === "arrived") body = `${addr}<div class="note ok">You are at the address.</div><button class="btn" data-act="checkin">Check in</button>`;
    else if (b.status === "inprogress") body = `${addr}${b.complaint ? `<div class="note red">A complaint is open on this job.</div>` : ""}<button class="btn" data-act="checkout">Check out</button><button class="btn danger" data-act="sos">SOS</button>`;
    else body = `<div class="card"><p><b>Waiting for the customer to confirm</b></p><div class="dots" aria-hidden="true"><span></span><span></span><span></span></div></div>`;
  } else {
    body = `<div class="card"><div class="row"><b>Online</b><span class="pill ok">Free to join. No fees.</span></div><p class="small muted">Requests near you appear here. You keep 90% of the service price.</p></div>
      <div class="card"><span class="lbl">Earnings</span>
      <div class="kv"><span>Awaiting tonight's payout</span><b>${K(sum("ready"))}</b></div>
      <div class="kv"><span>On hold (complaint open)</span><b>${K(sum("hold"))}</b></div>
      <div class="kv"><span>Paid</span><b>${K(sum("paid"))}</b></div></div>
      ${mine.length ? `<div class="card"><span class="lbl">Jobs</span>${mine.map((j) => `<div class="kv"><span>${j.id} · ${LABEL[j.service]}</span><span class="pill ${j.status === "paid" ? "ok" : j.status === "hold" ? "red" : "amber"}">${j.status === "paid" ? "Paid" : j.status === "hold" ? "On hold" : "Pending"}</span></div>`).join("")}</div>` : `<p class="small muted">No completed jobs yet.</p>`}
      ${b && b.status === "declined" ? `<div class="note">You declined the last request.</div>` : ""}`;
  }
  return `<div class="phone-col"><div class="phone"><div class="sbar"><span>14:00</span><span>Worker</span></div>
    <div class="appbar"><div class="av" style="width:34px;height:34px;font-size:13px">${initials(w.name)}</div><div><h3>${w.name}</h3><div class="sub">${sub}</div></div></div>
    <div class="scr">${body}</div></div><div class="phone-label">Worker app</div></div>`;
}

    <div class="panel"><h3>What happened</h3>${state.log.length ? `<ul class="log">${state.log.map((l) => `<li><time>${l.t}</time><span>${esc(l.m)}</span></li>`).join("")}</ul>` : `<p class="small muted">Events appear here as you use the phones.</p>`}</div></aside>`;
}

/* ---------- admin ---------- */
const STATUS_TXT = { awaiting: "Awaiting worker", enroute: "On the way", arrived: "Arrived", inprogress: "In progress", confirm: "Awaiting customer", done: "Completed", declined: "Declined" };
const STATUS_CLS = { awaiting: "amber", enroute: "", arrived: "ok", inprogress: "ok", confirm: "amber" };
const SIGN = { "Customer payment": 1, Membership: 1, Commission: 0, "Safety contribution": 0, Refund: -1, "Worker payout": -1 };
const TX_TYPES = ["Customer payment", "Membership", "Commission", "Safety contribution", "Worker payout", "Refund"];
const TXH = ["Time", "Reference", "Type", "Party", "Amount", "Status"];
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
const tbl = (head, rows, empty) => rows.length ? `<div class="tbl"><table><thead><tr>${head.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>` : `<p class="muted">${empty || "Nothing here yet."}</p>`;
const who = (name, sub) => `<b>${esc(name)}</b><div class="small muted">${esc(sub)}</div>`;
const w90 = (j) => r2(j.price * 0.9);
const sumBy = (a, f) => a.reduce((s, x) => s + f(x), 0);

function liveJob() {
  const b = state.booking; if (!b || b.status === "declined" || b.status === "done") return null;
  const w = worker(b.wid), c = AREAS[DEMO_CLIENT.area], ws = AREAS[w.area];
  const p = b.status === "awaiting" ? 0 : b.status === "enroute" && state.track ? 1 - state.track.d / state.track.d0 : 1;
  const note = { awaiting: "Waiting for the worker", enroute: state.track ? state.track.d.toFixed(1) + " km away" : "", arrived: "At the address", inprogress: "Checked in", confirm: "Awaiting customer confirmation" }[b.status];
  return { id: "B-2051", wid: b.wid, client: DEMO_CLIENT.name, cphone: DEMO_CLIENT.phone, service: b.service, status: b.status, area: DEMO_CLIENT.area, note, hours: b.hours, price: b.price, c, w: lerp(ws, c, p), priority: b.priority };
}
const activeJobs = () => [liveJob(), ...state.active].filter(Boolean);
const customers = () => [{ ...DEMO_CLIENT, tier: state.member, jobs: state.booking ? 1 : 0 }, ...CUSTOMERS];
function ledger() {
  const sumT = (types) => state.tx.filter((x) => types.includes(x.type)).reduce((s, x) => s + x.amt, 0);
  const lb = state.booking && !["declined", "done"].includes(state.booking.status) ? state.booking.worker : 0;
  const held = state.jobs.filter((j) => j.status === "ready" || j.status === "hold");
  return {
    received: r2(sumT(["Customer payment"]) - sumT(["Refund"])),
    owed: r2(sumBy(held, w90) + sumBy(state.active, w90) + lb),
    paid: r2(sumT(["Worker payout"])),
    income: r2(sumT(["Commission", "Safety contribution", "Membership"]))
  };
}
function txRow(x) {
  const sg = SIGN[x.type];
  const cls = sg > 0 ? "amt-in" : sg < 0 ? "amt-out" : "muted";
  const pc = x.type === "Refund" ? "red" : x.type === "Worker payout" ? "ok" : x.type === "Customer payment" ? "amber" : "";
  return `<tr><td>${x.t}</td><td>${esc(x.ref)}</td><td><span class="pill ${pc}">${x.type}</span></td><td>${esc(x.party)}</td><td class="${cls}">${sg < 0 ? "−" : "+"}${K(x.amt)}</td><td>${x.status}</td></tr>`;
}
function adminNav(counts) {
  const items = [["overview", "Overview"], ["live", "Live jobs"], ["bookings", "Bookings"], ["transactions", "Transactions"], ["payouts", "Payouts"], ["workers", "Workers"], ["customers", "Customers"], ["complaints", "Complaints and SOS"], ["members", "Memberships"]];
  return `<nav class="snav" aria-label="Admin sections">${items.map(([k, l]) => `<button data-act="adm" data-v="${k}" aria-current="${state.admin === k}"><span>${l}</span>${counts[k] ? `<span class="badge ${k === "complaints" ? "" : "n"}">${counts[k]}</span>` : ""}</button>`).join("")}</nav>`;
}
function adminView() {
  const act2 = activeJobs(), ready = state.jobs.filter((j) => j.status === "ready"), openC = state.complaints.filter((c) => c.status === "open");
  const counts = { live: act2.length, payouts: new Set(ready.map((j) => j.wid)).size, workers: state.photoPending ? 1 : 0, complaints: openC.length };
  const ctx = { M: ledger(), act2, ready, openC };
  const sections = { overview: secOverview, live: secLive, bookings: secBookings, transactions: secTx, payouts: secPayouts, workers: secWorkers, customers: secCustomers, complaints: secComplaints, members: secMembers };
  return `${guide()}<div class="adm">${adminNav(counts)}<div class="adm-main">${sections[state.admin](ctx)}</div></div>`;
}
function liveRow(j) {
  const w = worker(j.wid);
  return `<tr><td><b>${j.id}</b>${j.priority ? ` <span class="pill ok">★</span>` : ""}</td><td>${LABEL[j.service]}</td><td>${who(j.client, j.cphone)}</td><td>${who(w.name, WPHONE[w.id])}</td><td><span class="pill ${STATUS_CLS[j.status] || ""}">${STATUS_TXT[j.status]}</span></td><td>${who(j.area, j.note)}</td></tr>`;
}
const LIVE_HEAD = ["Job", "Service", "Client", "Worker", "Status", "Where"];

function secOverview({ M, act2, ready, openC }) {
  const due = r2(sumBy(ready, w90)), att = [];
  if (openC.length) att.push(`<li><span class="pill red">${openC.length} open</span> complaints or SOS <button class="btn ghost small" data-act="adm" data-v="complaints">Review</button></li>`);
  if (ready.length) att.push(`<li><span class="pill amber">${K(due)}</span> payouts due tonight <button class="btn ghost small" data-act="adm" data-v="payouts">Open payouts</button></li>`);
  if (state.photoPending) att.push(`<li><span class="pill amber">1 photo</span> change waiting for approval <button class="btn ghost small" data-act="adm" data-v="workers">Review</button></li>`);
  return `<div class="tiles">
      <div class="tile"><div class="v">${K(M.received)}</div><div class="l">Received from customers today</div></div>
      <div class="tile"><div class="v">${K(M.owed)}</div><div class="l">Held for workers</div></div>
      <div class="tile"><div class="v">${K(M.paid)}</div><div class="l">Paid to workers</div></div>
      <div class="tile"><div class="v">${K(M.income)}</div><div class="l">HomeTrust income (commission, 3%, memberships)</div></div></div>
    <div class="two"><div class="panel"><h3>Needs attention</h3>${att.length ? `<ul class="att">${att.join("")}</ul>` : `<p class="muted">Nothing needs attention.</p>`}</div>
      <div class="panel"><h3>Live now (${act2.length})</h3>${tbl(["Job", "Client", "Worker", "Status"], act2.slice(0, 4).map((j) => `<tr><td><b>${j.id}</b></td><td>${esc(j.client)}</td><td>${worker(j.wid).name}</td><td><span class="pill ${STATUS_CLS[j.status] || ""}">${STATUS_TXT[j.status]}</span></td></tr>`), "No jobs right now.")}
        <p style="margin-top:10px"><button class="btn ghost small" data-act="adm" data-v="live">Open live map</button></p></div></div>
    <div class="panel" style="margin-top:16px"><h3>Latest transactions</h3>${tbl(TXH, state.tx.slice(0, 6).map(txRow))}
      <p style="margin-top:10px"><button class="btn ghost small" data-act="adm" data-v="transactions">All transactions</button></p></div>`;
}

function secLive({ act2 }) {
  const roads = `<g stroke="var(--line)" stroke-width="1.2"><path d="M0 60H640M0 130H640M0 200H640M0 265H640M110 0V300M240 0V300M360 0V300M470 0V300M570 0V300"/></g>`;
  const areas = Object.entries(AREAS).map(([n, [x, y]]) => `<text x="${x - 4}" y="${y + 30}" font-size="11" fill="var(--muted)">${n}</text>`).join("");
  const pins = act2.map((j) => {
    const [cx, cy] = j.c, [wx, wy] = j.w, near = Math.hypot(cx - wx, cy - wy) < 4;
    return `<g>${near ? "" : `<line x1="${wx}" y1="${wy}" x2="${cx}" y2="${cy}" stroke="var(--brand)" stroke-width="2" stroke-dasharray="5 4"/>`}<circle cx="${cx}" cy="${cy}" r="9" fill="var(--red)"/><circle cx="${wx}" cy="${wy}" r="7" fill="var(--brand)" stroke="#fff" stroke-width="2"/><text x="${cx + 13}" y="${cy - 10}" font-size="12" font-weight="700" fill="var(--fg)">${j.id}</text></g>`;
  }).join("");
  return `<div class="panel"><h3>Live jobs (${act2.length})</h3>
    <div class="bigmap"><svg viewBox="0 0 640 300" role="img" aria-label="Map of Lusaka showing active jobs, with the client location and the worker's position">${roads}${areas}${pins}</svg>
      <div class="legend"><span>● <span style="color:var(--red)">Client address</span></span><span>● <span style="color:var(--brand)">Worker position</span></span><span>Sample map, not to scale</span></div></div></div>
    <div class="panel" style="margin-top:16px"><h3>Who is where</h3>${tbl(LIVE_HEAD, act2.map(liveRow), "No jobs right now.")}</div>`;
}

function secBookings({ act2 }) {
  const done = state.jobs.map((j) => {
    const st = j.status === "paid" ? ["ok", "Completed · paid"] : j.status === "hold" ? ["red", "Completed · on hold"] : ["amber", "Completed · payout due"];
    return `<tr><td><b>${j.id}</b></td><td>${esc(j.client)}</td><td>${j.worker}</td><td>${LABEL[j.service]}</td><td>${j.hours} h</td><td>${K(j.price)}</td><td><span class="pill ${st[0]}">${st[1]}</span></td></tr>`;
  });
  const live = act2.map((j) => `<tr><td><b>${j.id}</b></td><td>${esc(j.client)}</td><td>${worker(j.wid).name}</td><td>${LABEL[j.service]}</td><td>${j.hours} h</td><td>${K(j.price)}</td><td><span class="pill ${STATUS_CLS[j.status] || ""}">${STATUS_TXT[j.status]}</span></td></tr>`);
  const declined = `<tr><td><b>B-2039</b></td><td>Peter Sakala</td><td>Bwalya Tembo</td><td>Housekeeper</td><td>3 h</td><td>${K(150)}</td><td><span class="pill red">Declined · refunded</span></td></tr>`;
  return `<div class="panel"><h3>All bookings</h3><p class="small muted" style="margin-bottom:10px">Prices are the service price, before the 3% contribution.</p>${tbl(["Job", "Client", "Worker", "Service", "Length", "Price", "Status"], [...live, ...done, declined])}</div>`;
}

function secTx() {
  const f = state.txf, rows = state.tx.filter((x) => f === "all" || x.type === f);
  const chips = ["all", ...TX_TYPES].map((t) => `<button class="chip" data-act="txf" data-v="${t}" aria-pressed="${f === t}">${t === "all" ? "All" : t}</button>`).join("");
  return `<div class="panel"><h3>Transaction history</h3><p class="small muted" style="margin-bottom:10px">Every payment, refund, payout, commission and membership charge, newest first. Commission and safety rows are income carved out of customer payments, not extra cash movements.</p>
    <div class="chips" style="margin-bottom:12px" role="group" aria-label="Filter by type">${chips}</div>${tbl(TXH, rows.map(txRow), "No transactions of this type yet.")}
    <p class="small muted" style="margin-top:10px">${rows.length} ${rows.length === 1 ? "entry" : "entries"}</p></div>`;
}

function secPayouts({ ready }) {
  const wids = [...new Set(ready.map((j) => j.wid))], paid = state.jobs.filter((j) => j.status === "paid");
  const rows = wids.map((id) => { const js = ready.filter((j) => j.wid === id); return `<tr><td>${who(worker(id).name, WPHONE[id])}</td><td>${js.length}</td><td><b>${K(sumBy(js, w90))}</b></td>
    <td><input type="text" id="ref-${id}" placeholder="Mobile money ref" value="${esc(state.refs[id] || "")}" aria-label="Reference for ${worker(id).name}"></td>
    <td><button class="btn small" data-act="payout" data-v="${id}">Mark as paid</button></td></tr>`; });
  const paidRows = paid.map((j) => `<tr><td>${j.id}</td><td>${j.worker}</td><td>${LABEL[j.service]}</td><td>${K(w90(j))}</td><td>${esc(j.ref || "")}</td></tr>`);
  return `<div class="panel"><h3>Tonight's payouts</h3><p class="small muted" style="margin-bottom:10px">Completed jobs without an open complaint, totalled per worker. Pay each worker from the HomeTrust mobile money account, then record the reference.</p>
      ${tbl(["Worker", "Jobs", "To pay", "Reference", ""], rows, "Nothing left to pay tonight.")}</div>
    <div class="panel" style="margin-top:16px"><h3>Paid</h3>${tbl(["Job", "Worker", "Service", "Amount", "Reference"], paidRows, "No payouts recorded yet.")}</div>`;
}

function secWorkers() {
  const busy = new Set(activeJobs().map((j) => j.wid));
  const rows = WORKERS.map((w, i) => `<tr><td>${who(w.name, WPHONE[w.id])}</td><td>${w.services.map((s) => LABEL[s]).join(", ")}</td><td>${w.area}</td><td>★ ${w.rating} · ${w.jobs} jobs</td>
    <td><div class="checks">${CHECKS.map((c) => `<span class="pill ok" title="${c}">✓</span>`).join("")}</div></td>
    <td>${i === 3 ? (state.photoPending ? `<span class="pill amber">New photo waiting</span> <button class="btn small" data-act="photo" data-v="ok">Approve</button> <button class="btn ghost small" data-act="photo" data-v="no">Reject</button>` : `<span class="pill ${state.photoDone === "ok" ? "ok" : "red"}">${state.photoDone === "ok" ? "Approved" : "Rejected"}</span>`) : `<span class="pill ok">Approved</span>`}</td>
    <td><span class="pill ${busy.has(w.id) ? "amber" : "ok"}">${busy.has(w.id) ? "On a job" : "Available"}</span></td></tr>`);
  return `<div class="panel"><h3>Workers</h3><p class="small muted" style="margin-bottom:10px">A worker is listed to customers only when all six checks are cleared: ${CHECKS.join(", ")}. A changed profile photo needs approval first.</p>
    ${tbl(["Worker", "Services", "Area", "Rating", "Six checks", "Profile photo", "Now"], rows)}</div>`;
}

function secCustomers() {
  const rows = customers().map((c) => `<tr><td>${who(c.name, c.phone)}</td><td>${c.area}</td><td><span class="pill ${c.tier === "basic" ? "" : "ok"}">${c.tier === "basic" ? "Basic" : "★ " + PLANS[c.tier].name}</span></td><td>${c.jobs}</td></tr>`);
  return `<div class="panel"><h3>Customers</h3>${tbl(["Customer", "Area", "Plan", "Bookings"], rows)}</div>`;
}

function secComplaints({ openC }) {
  const rows = state.complaints.map((c) => `<tr><td><b>${c.id}</b></td><td><span class="pill ${c.type === "SOS" ? "red" : "amber"}">${c.type}</span></td><td>${c.job}</td><td>${esc(c.client)}</td><td>${esc(c.worker)}</td><td>${esc(c.text)}</td>
    <td>${c.status === "open" ? `<span class="pill red">Open</span>` : `<span class="pill ok">Resolved</span>`}</td><td>${c.status === "open" ? `<button class="btn small" data-act="resolve" data-v="${c.job}">Resolve and release hold</button>` : ""}</td></tr>`);
  return `<div class="panel"><h3>Complaints and SOS (${openC.length} open)</h3><p class="small muted" style="margin-bottom:10px">The worker's payout for a job stays on hold while its complaint or SOS is open.</p>
    ${tbl(["ID", "Type", "Job", "Client", "Worker", "Details", "Status", ""], rows, "No complaints.")}</div>`;
}

function secMembers() {
  const cs = customers(), mem = cs.filter((c) => c.tier !== "basic");
  const count = (t) => cs.filter((c) => c.tier === t).length;
  const mrr = sumBy(mem, (c) => PLANS[c.tier].price);
  const rows = mem.map((c) => `<tr><td>${who(c.name, c.phone)}</td><td><span class="pill ok">★ ${PLANS[c.tier].name}</span></td><td>${K(PLANS[c.tier].price)}</td></tr>`);
  return `<div class="tiles"><div class="tile"><div class="v">${mem.length}</div><div class="l">Paying members</div></div><div class="tile"><div class="v">${K(mrr)}</div><div class="l">Membership revenue per month</div></div><div class="tile"><div class="v">${cs.length - mem.length}</div><div class="l">Basic (free) accounts</div></div></div>
    <div class="plans">${Object.entries(PLANS).map(([k, p]) => `<div class="plan"><div class="row"><b>${p.name}</b><span class="pill ok">Active</span></div><div class="pr">${p.price ? "K" + p.price : "Free"}<span class="small muted">${p.price ? " / month" : ""}</span></div><ul>${p.perks.map((x) => `<li>${x}</li>`).join("")}</ul><div class="small muted">${count(k)} ${count(k) === 1 ? "customer" : "customers"}</div></div>`).join("")}</div>
    <div class="panel" style="margin-top:16px"><h3>Members</h3>${tbl(["Customer", "Plan", "Monthly fee"], rows, "No paying members yet.")}</div>
    <p class="small muted" style="margin-top:10px">Membership is optional and does not include free labour. Members still pay for each service and the 3% contribution. Try joining a plan in the customer app.</p>`;
}

/* ---------- website ---------- */
function websiteView() {
  const eg = money(50, 3);
  return `<section class="hero"><div><h1>Verified help for your home in Lusaka.</h1>
      <p class="lead">Nannies, babysitters, cleaners, cooks and housekeepers who have passed six checks. See who is nearest, book, pay in the app and follow them to your door.</p>
      <div class="cta"><button class="btn" data-act="cta">Get it on Google Play</button><button class="btn ghost" data-act="tab" data-v="apps">Try the prototype</button></div></div>
    <div class="hero-card" aria-hidden="true"><div class="row"><span>Mwila Chanda · Cleaner</span><b>0.8 km</b></div><div class="row"><span>Natasha Banda · Nanny</span><b>1.6 km</b></div><div class="row"><span>Joyce Phiri · Cook</span><b>2.3 km</b></div><p class="small" style="opacity:.85">Nearest verified workers appear first.</p></div></section>
    <section class="sec"><h2>How it works</h2><p class="intro">Three steps, and you can see everything on your phone.</p><div class="grid3">
      <div class="panel"><h3>1. Choose</h3><p class="muted">Pick a service and see verified workers, nearest first, with their rating and price per hour.</p></div>
      <div class="panel"><h3>2. Pay in the app</h3><p class="muted">The price is shown before you pay. HomeTrust holds the payment until the job is done.</p></div>
      <div class="panel"><h3>3. Follow arrival</h3><p class="muted">Once the worker accepts, you see their distance and arrival time until they reach you.</p></div></div></section>
    <section class="sec"><h2>Six checks before anyone is listed</h2><p class="intro">HomeTrust does every check. Interviews and skills assessments are done through WhatsApp or in person.</p><div class="grid3">
      ${CHECKS.map((c, i) => `<div class="panel"><h3>${c}</h3><p class="muted">${["A clear photo of the worker and their NRC.", "Previous employers are contacted.", "Certificate checked and renewed every 12 months.", "Certificate checked and renewed every 12 months.", "A practical assessment of the work they will do.", "Conduct, language and expectations."][i]}</p></div>`).join("")}</div></section>
    <section class="sec"><h2>Work with HomeTrust</h2><p class="intro">Joining is free. You keep 90% of the service price, and you are paid every evening for the day's jobs.</p><div class="grid3">
      <div class="panel"><h3>No fees to join</h3><p class="muted">No subscription and no charge to see jobs.</p></div>
      <div class="panel"><h3>Paid daily</h3><p class="muted">HomeTrust tracks what you earned and pays you each evening.</p></div>
      <div class="panel"><h3>Your photo is you</h3><p class="muted">A profile photo must show you. Any change is approved by HomeTrust.</p></div></div></section>
    <section class="sec"><h2>Clear prices</h2><p class="intro">Sample hourly rates. Final rates are set by HomeTrust.</p><div class="two">
      <div class="panel"><table class="ctab"><thead><tr><th>Service</th><th>Per hour</th></tr></thead><tbody>${Object.keys(RATE).map((s) => `<tr><td>${LABEL[s]}</td><td>K${RATE[s]}</td></tr>`).join("")}</tbody></table></div>
      <div class="panel"><h3>A 3-hour cleaner booking</h3><div class="kv"><span>Service (3 × K50)</span><span>${K(eg.price)}</span></div><div class="kv"><span>Trust &amp; Safety contribution (3%)</span><span>${K(eg.safety)}</span></div><div class="kv total"><span>You pay</span><span>${K(eg.total)}</span></div>
      <p class="small muted" style="margin-top:8px">The contribution supports worker checks, check-in records, SOS and support. It is not insurance.</p></div></div></section>
    <section class="sec"><h2>Optional membership</h2><p class="intro">Everyone starts on Basic for free. Paid plans add priority and extra help. Membership does not include free labour, and you still pay for each service.</p><div class="plans">
      ${Object.values(PLANS).map((p) => `<div class="plan"><b>${p.name}</b><div class="pr">${p.price ? "K" + p.price : "Free"}<span class="small muted">${p.price ? " / month" : ""}</span></div><ul>${p.perks.map((x) => `<li>${x}</li>`).join("")}</ul></div>`).join("")}</div></section>
    <section class="sec"><h2>Safety built in</h2><div class="grid3">
      <div class="panel"><h3>Location only for the job</h3><p class="muted">Shared during a booking and stopped at check-out.</p></div>
      <div class="panel"><h3>SOS and complaints</h3><p class="muted">Reach HomeTrust from the app. A complaint pauses the worker's payout.</p></div>
      <div class="panel"><h3>Private documents</h3><p class="muted">Only authorised staff see a worker's documents. Your address is shared after acceptance.</p></div></div></section>
    <footer class="footer"><p>HomeTrust Zambia. Prototype with sample workers, rates and prices. Full-time placement is coming soon.</p></footer>`;
}

/* ---------- render ---------- */
function postRender() {
  document.querySelectorAll(".map").forEach((m) => {
    const path = m.querySelector(".route"), dot = m.querySelector(".wdot");
    if (!path || !dot) return;
    const p = path.getPointAtLength(path.getTotalLength() * Number(dot.dataset.p));
    dot.setAttribute("cx", p.x); dot.setAttribute("cy", p.y);
  });
}
function render() {
  const v = $("#view");
  const active = document.activeElement && document.activeElement.id;
  const caret = active && document.activeElement.selectionStart;
  v.innerHTML = state.tab === "website" ? websiteView() : state.tab === "apps" ? `${guide()}<div class="apps">${customerPhone()}${workerPhone()}${sidePanel()}</div>` : adminView();
  ["website", "apps", "admin"].forEach((t) => $("#t-" + t).setAttribute("aria-current", String(state.tab === t)));
  postRender();
  if (active && ["INPUT", "TEXTAREA"].includes((document.getElementById(active) || {}).tagName) && !timer) {
    const el = document.getElementById(active); if (el) { el.focus(); try { el.setSelectionRange(caret, caret); } catch (e) {} }
  }
}
state = fresh();
render();
</script>
