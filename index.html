<style>
/* Concept: a quiet green workbench. Top bar with tabs, a website view, two phones side by side with a money panel, and an admin payout desk. */
:root {
  --bg: #edf3ef;
  --surface: #ffffff;
  --surface2: #f5f9f6;
  --fg: #15231d;
  --muted: #55665e;
  --line: #d6e1db;
  --brand: #0d6a55;
  --brand-fg: #ffffff;
  --brand-soft: #daeee6;
  --amber: #8f5c00;
  --amber-soft: #fbefd0;
  --red: #b3261e;
  --red-soft: #fbe2df;
  --ok: #17753f;
  --ok-soft: #dbf1e3;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1613; --surface: #16211d; --surface2: #1b2924; --fg: #e5efea; --muted: #94a79e;
    --line: #2a3b34; --brand: #45b898; --brand-fg: #052219; --brand-soft: #1a3a30;
    --amber: #e8b94c; --amber-soft: #3a2f12; --red: #ff8f86; --red-soft: #3e201d;
    --ok: #62d392; --ok-soft: #173a29; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1613; --surface: #16211d; --surface2: #1b2924; --fg: #e5efea; --muted: #94a79e;
  --line: #2a3b34; --brand: #45b898; --brand-fg: #052219; --brand-soft: #1a3a30;
  --amber: #e8b94c; --amber-soft: #3a2f12; --red: #ff8f86; --red-soft: #3e201d;
  --ok: #62d392; --ok-soft: #173a29; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.12; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.wrap { max-width: 1140px; margin: 0 auto; }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 14px 0; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 20px; }
.logo-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--brand); display: grid; place-items: center; }
.logo-mark svg { width: 18px; height: 18px; }
.tag { font-size: 12px; color: var(--muted); }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-left: auto; }
.tabs button { border: 0; background: transparent; padding: 8px 14px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.tabs button[aria-current="true"] { background: var(--brand); color: var(--brand-fg); }
.reset { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-weight: 600; color: var(--muted); }

/* guide bar */
.guide { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--brand-soft); border-radius: 12px; padding: 12px 16px; margin: 4px 0 20px; }
.guide b { font-family: var(--font-display); }
.guide .step { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--brand); }

/* apps layout */
.apps { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.phone-col { display: flex; flex-direction: column; gap: 10px; align-items: center; width: min(360px, 100%); }
.phone-label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.phone { width: 100%; height: 700px; border: 8px solid #1a2420; border-radius: 38px; background: var(--surface); overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 18px 40px rgba(0,0,0,.14); }
.sbar { display: flex; justify-content: space-between; padding: 8px 20px 4px; font-size: 11px; font-weight: 700; color: var(--muted); }
.appbar { display: flex; align-items: center; gap: 8px; padding: 6px 16px 10px; border-bottom: 1px solid var(--line); }
.appbar h3 { font-size: 18px; }
.appbar .sub { font-size: 12px; color: var(--muted); }
.back { border: 0; background: var(--surface2); width: 30px; height: 30px; border-radius: 9px; font-weight: 700; }
.scr { flex: 1; overflow-y: auto; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.side { flex: 1; min-width: min(300px, 100%); display: flex; flex-direction: column; gap: 16px; }

/* shared parts */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.panel h3 { font-size: 17px; margin-bottom: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-fg); }
.btn { border: 0; background: var(--brand); color: var(--brand-fg); border-radius: 12px; padding: 12px 16px; font-weight: 700; width: 100%; }
.btn.ghost { background: var(--surface2); color: var(--fg); border: 1px solid var(--line); }
.btn.danger { background: var(--red); color: #fff; }
.btn.small { width: auto; padding: 8px 12px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: .5; cursor: default; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 3px 8px; background: var(--brand-soft); color: var(--brand); white-space: nowrap; }
.pill.amber { background: var(--amber-soft); color: var(--amber); }
.pill.red { background: var(--red-soft); color: var(--red); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.lbl { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; display: block; }
input[type="text"], input[type="number"], textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 10px 12px; font: inherit; }
textarea { min-height: 64px; resize: vertical; }
.card { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.wk { display: flex; gap: 12px; align-items: center; }
.av { width: 44px; height: 44px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; flex: none; }
.wk .nm { font-weight: 700; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
.kv.total { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 8px; font-weight: 800; }
.note { background: var(--amber-soft); color: var(--amber); border-radius: 10px; padding: 8px 10px; font-size: 13px; font-weight: 600; }
.note.red { background: var(--red-soft); color: var(--red); }
.note.ok { background: var(--ok-soft); color: var(--ok); }
.stars { display: flex; gap: 4px; }
.stars button { border: 0; background: transparent; font-size: 26px; padding: 0 2px; color: var(--line); }
.stars button[aria-pressed="true"] { color: #e0a000; }
.dots span { display: inline-block; width: 8px; height: 8px; margin-right: 4px; border-radius: 50%; background: var(--brand); animation: pulse 1.2s infinite ease-in-out; }
.dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
@keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
.map { border: 1px solid var(--line); border-radius: 14px; background: var(--surface2); }
.map svg { display: block; width: 100%; height: auto; }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; }
.log li { display: flex; gap: 10px; font-size: 13px; }
.log time { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.ledger .kv { font-variant-numeric: tabular-nums; }

/* admin */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 20px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.tile .v { font-family: var(--font-display); font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tile .l { font-size: 13px; color: var(--muted); }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 620px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: middle; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
td input { width: 140px; padding: 7px 9px; }
.checks { display: flex; gap: 4px; flex-wrap: wrap; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }

/* website */
.hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: 32px; align-items: center; padding: 28px 0 40px; }
.hero h1 { font-size: clamp(34px, 6vw, 58px); font-weight: 800; letter-spacing: -.02em; }
.hero p.lead { font-size: 18px; color: var(--muted); margin: 16px 0 24px; max-width: 52ch; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; }
.cta .btn { width: auto; padding: 14px 20px; }
.hero-card { background: var(--brand); color: var(--brand-fg); border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
.hero-card .row { background: rgba(255,255,255,.12); border-radius: 14px; padding: 12px 14px; }
.sec { padding: 34px 0; border-top: 1px solid var(--line); }
.sec h2 { font-size: clamp(26px, 4vw, 36px); margin-bottom: 8px; }
.sec .intro { color: var(--muted); max-width: 60ch; margin-bottom: 22px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.grid3 .panel h3 { margin-bottom: 6px; }
.ctab { width: 100%; border-collapse: collapse; min-width: 0; }
.footer { padding: 28px 0 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px); }

.cfg { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
/* admin dashboard */
.adm { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 20px; align-items: start; }
.snav { display: flex; flex-direction: column; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px; position: sticky; top: 12px; }
.snav button { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 0; background: transparent; padding: 9px 12px; border-radius: 9px; text-align: left; font-weight: 600; color: var(--muted); }
.snav button[aria-current="true"] { background: var(--brand-soft); color: var(--brand); }
.badge { min-width: 20px; text-align: center; font-size: 11px; font-weight: 800; border-radius: 999px; padding: 1px 7px; background: var(--red); color: #fff; }
.badge.n { background: var(--surface2); color: var(--muted); }
.att { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.att li { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bigmap { border: 1px solid var(--line); border-radius: 14px; background: var(--surface2); overflow: hidden; }
.bigmap svg { display: block; width: 100%; height: auto; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding: 8px 12px; }
.amt-in { color: var(--ok); font-weight: 700; }
.amt-out { color: var(--red); font-weight: 700; }
.plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.plan { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.plan.on { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
.plan ul { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
.plan .pr { font-family: var(--font-display); font-weight: 800; font-size: 24px; }
button.pill { border: 0; cursor: pointer; }
.mem { margin-left: auto; }
@media (max-width: 860px) {
  .adm { grid-template-columns: 1fr; }
  .snav { flex-direction: row; overflow-x: auto; position: static; }
  .snav button { white-space: nowrap; }
}
@media (max-width: 760px) {
  .hero { grid-template-columns: 1fr; }
  .tabs { margin-left: 0; width: 100%; }
  .tabs button { flex: 1; padding: 8px 6px; }
  .phone { height: 660px; }
}
@media (prefers-reduced-motion: reduce) { .dots span { animation: none; opacity: 1; } }
</style>

/* ---------- state ---------- */
let state, timer = null, clock = 0, toastTimer = null;
const fresh = () => (resetCfg(), {
  tab: "website", service: "cleaner",
  cust: { screen: "home", wid: null, when: "now", hours: 3, address: "Plot 24, Kabulonga, Lusaka", notes: "", special: false, specialText: "", ft: { role: "housekeeper", arr: "Live-out", start: "Within 2 weeks", notes: "" }, agree: false },
  booking: null, track: null, log: [], jobs: sampleJobs(), photoPending: true, photoDone: null,
  member: "basic", admin: "overview", txf: "all", active: sampleActive(), complaints: sampleComplaints(), tx: sampleTx(),
  placement: null, placements: samplePlacements(), ftFee: true, float: sampleFloat(), wtop: { open: false, amt: 1000 }
});
const worker = (id) => WORKERS.find((w) => w.id === id);
const r2 = (n) => Math.round(n * 100) / 100;
const K = (n) => "K" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const K0 = (n) => "K" + Number(n).toLocaleString("en-US", { maximumFractionDigits: 0 });
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const stamp = () => { clock += 2; return pad(14 + Math.floor(clock / 60)) + ":" + pad(clock % 60); };
const say = (t) => state.log.unshift({ t: stamp(), m: t });
const txAdd = (ref, type, party, amt, status) => state.tx.unshift({ t: stamp(), ref, type, party, amt, status });
const money = (rate, hours) => ({ price: rate * hours });
const topupPrice = (credit) => r2(credit * CFG.creditPct / 100);
const hoursOpts = () => Array.from({ length: Math.max(1, 9 - CFG.minHours) }, (_, i) => CFG.minHours + i);
const initials = (n) => n.split(" ").map((p) => p[0]).join("");
const $ = (s) => document.querySelector(s);
const busyIds = () => {
  const s = new Set(state.active.map((j) => j.wid));
  if (state.booking && !["declined", "done"].includes(state.booking.status)) s.add(state.booking.wid);
  state.placements.filter((p) => p.status === "hired").forEach((p) => s.add(p.picked));
  if (state.placement && state.placement.status === "hired") s.add(state.placement.picked);
  return s;
};
const isAvailable = (w) => !busyIds().has(w.id) && state.float[w.id] >= CFG.minListed;
const personaW = () => {
  const b = state.booking, p = state.placement;
  if (b) return worker(b.wid);
  if (p && p.picked && ["offered", "accepted", "hired"].includes(p.status)) return worker(p.picked);
  return WORKERS[0];
};

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
}

/* ---------- actions ---------- */
function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
function startTrip() {
  const b = state.booking, w = worker(b.wid);
  state.track = { d: w.km, d0: w.km };
  b.status = "enroute"; say(w.name + " accepted and is on the way.");
  stopTimer();
  timer = setInterval(() => {
    const t = state.track; t.d = Math.max(0, t.d - t.d0 / 14);
    if (t.d <= 0.02) { t.d = 0; b.status = "arrived"; stopTimer(); say(w.name + " has arrived."); }
    render();
  }, 700);
}
function finishJob(auto) {
  const b = state.booking, w = worker(b.wid);
  state.float[b.wid] = r2(state.float[b.wid] - b.price);
  b.status = "done";
  state.jobs.push({ id: "J-1045", wid: b.wid, worker: w.name, client: DEMO_CLIENT.name, service: b.service, hours: b.hours, price: b.price, status: "counted" });
  say(auto ? "No check-out was received, so the job was counted automatically " + CFG.autoMinutes + " minutes after the booked end time." : w.name + " checked out. The job is counted.");
  txAdd("J-1045", "Credit used", w.name, b.price, "Deducted from job credit");
  say("HomeTrust deducted " + K(b.price) + " from " + w.name + "'s job credit. Balance " + K(state.float[b.wid]) + ".");
  if (state.float[b.wid] < CFG.minListed) say(w.name + " is below the minimum credit and is hidden from customers until they top up.");
}
function act(a, v) {
  const c = state.cust, b = state.booking;
  switch (a) {
    case "tab": state.tab = v; break;
    case "reset": stopTimer(); clock = 0; state = fresh(); state.tab = "apps"; break;
    case "svc": state.service = v; break;
    case "pick": c.wid = v; c.screen = "book"; c.special = false; c.specialText = ""; c.hours = Math.max(c.hours, CFG.minHours); break;
    case "back": c.screen = c.screen === "fthire" ? "ftstatus" : b && b.status !== "declined" && c.screen === "member" ? "status" : "home"; break;
    case "when": c.when = v; break;
    case "hours": c.hours = Number(v); break;
    case "special": c.special = !c.special; break;
    case "send": {
      const w = worker(c.wid), rate = RATE[state.service], m = money(rate, c.hours);
      state.booking = { wid: c.wid, service: state.service, hours: c.hours, rate, ...m, when: c.when, address: c.address, notes: c.notes, special: c.special, specialText: c.specialText, status: "awaiting", complaint: false, rating: 5 };
      c.screen = "status";
      say("Customer requested " + w.name + " for " + c.hours + " hours. Final charge " + K(m.price) + ", paid to the worker directly.");
      break;
    }
    case "cancel": say("Customer cancelled before the worker accepted."); state.booking = null; c.screen = "home"; break;
    case "decline": say(worker(b.wid).name + " declined the request."); b.status = "declined"; break;
    case "accept":
      if (state.float[b.wid] < b.price) { toast("Top up your job credit to accept this job."); return; }
      startTrip(); return render();
    case "checkin": b.status = "inprogress"; say("Checked in. The app confirmed the worker is within 120 m of the address."); break;
    case "checkinfar": toast("Too far: you are 2.4 km from the address. Move closer to check in."); return;
    case "checkout": finishJob(false); break;
    case "autoc": finishJob(true); break;
    case "sos": case "problem": {
      if (!b.complaint) {
        const sos = a === "sos";
        state.complaints.unshift({ id: "C-" + (302 + state.complaints.length), job: "J-1045", client: DEMO_CLIENT.name, worker: worker(b.wid).name, type: sos ? "SOS" : "Complaint", text: sos ? "SOS pressed during the visit." : "Problem reported during the visit.", status: "open" });
      }
      b.complaint = true;
      say(a === "sos" ? "SOS sent to the HomeTrust desk." : "Complaint raised with HomeTrust.");
      break;
    }
    case "star": b.rating = Number(v); break;
    case "again": state.booking = null; c.screen = "home"; break;
    case "resolve":
      state.complaints.filter((x) => x.job === v).forEach((x) => { x.status = "resolved"; });
      if (b && v === "J-1045") b.complaint = false;
      say("Complaint on " + v + " resolved."); break;
    case "reverse": {
      const j = state.jobs.find((x) => x.id === v); if (!j || j.status === "reversed") break;
      j.status = "reversed"; state.float[j.wid] = r2(state.float[j.wid] + j.price);
      txAdd(v, "Reversal", j.worker, j.price, "Returned to job credit");
      say(K(j.price) + " of job credit returned to " + j.worker + " for " + v + ".");
      break;
    }
    case "adm": state.admin = v; break;
    case "gofloat": state.tab = "admin"; state.admin = "float"; break;
    case "txf": state.txf = v; break;
    case "photo": state.photoPending = false; state.photoDone = v; toast(v === "ok" ? "New photo approved." : "Photo change rejected. The old photo stays."); break;
    case "cta": toast("Prototype only. The Google Play link goes live at launch."); return;
    case "memscr": c.screen = "member"; break;
    case "join": {
      if (v === "basic") {
        if (state.member !== "basic") {
          const p = PLANS[state.member];
          txAdd("MEM-0415R", "Membership refund", DEMO_CLIENT.name + " (" + p.name + ")", p.price, "Refunded within " + CFG.refundDays + " days");
          say("Membership cancelled within " + CFG.refundDays + " days. " + K(p.price) + " refunded.");
          toast("Membership cancelled and refunded. Simulated.");
        }
        state.member = "basic"; break;
      }
      const p = PLANS[v]; state.member = v;
      say("Customer joined " + p.name + " (" + K(p.price) + " per month).");
      txAdd("MEM-0415", "Membership", DEMO_CLIENT.name + " (" + p.name + ")", p.price, "Active");
      toast("Welcome to " + p.name + ". Simulated payment, no money moved.");
      break;
    }
    case "wtop": state.wtop.open = true; state.wtop.amt = CFG.packages[1] || CFG.packages[0]; break;
    case "wtopback": state.wtop.open = false; break;
    case "wamt": state.wtop.amt = Number(v); break;
    case "wpay": {
      const w = personaW(), credit = state.wtop.amt, paid = topupPrice(credit);
      state.float[w.id] = r2(state.float[w.id] + credit); state.wtop.open = false;
      txAdd("TOP-" + (6905 + state.tx.length), "Credit top-up", w.name, paid, K0(credit) + " of job credit");
      say(w.name + " paid " + K(paid) + " for " + K0(credit) + " of job credit. Balance " + K(state.float[w.id]) + ".");
      toast("Job credit added. Simulated payment.");
      break;
    }
    case "ft": c.screen = state.placement ? "ftstatus" : "fulltime"; break;
    case "ftrole": c.ft.role = v; break;
    case "ftarr": c.ft.arr = v; break;
    case "ftstart": c.ft.start = v; break;
    case "ftsend":
      state.placement = { id: "P-503", client: DEMO_CLIENT.name, role: c.ft.role, arrangement: c.ft.arr, start: c.ft.start, notes: c.ft.notes, status: "requested" };
      c.screen = "ftstatus"; say("Customer asked for a full-time " + LABEL[c.ft.role].toLowerCase() + " (" + c.ft.arr + ")."); break;
    case "ftshort": {
      const p = (v && state.placements.find((x) => x.id === v)) || state.placement;
      if (p && p.status === "requested") { p.status = "shortlist"; say("HomeTrust sent a shortlist for " + p.id + "."); }
      break;
    }
    case "ftpick": state.placement.picked = v; state.placement.status = "offered"; say("Employer offered the full-time job to " + worker(v).name + "."); break;
    case "ftwaccept": { const p = state.placement; p.status = "accepted"; say(worker(p.picked).name + " accepted the full-time offer."); break; }
    case "ftwdecline": { const p = state.placement; say(worker(p.picked).name + " declined the full-time offer."); p.picked = null; p.status = "shortlist"; break; }
    case "ftreview": c.screen = "fthire"; c.agree = false; break;
    case "ftagree": c.agree = !c.agree; break;
    case "ftconfirm": {
      const p = state.placement; p.status = "hired"; p.feePaid = state.ftFee; c.screen = "ftstatus";
      say("Hire confirmed: " + worker(p.picked).name + ". No job credit is used for full-time workers.");
      if (state.ftFee) txAdd(p.id, "Placement fee", DEMO_CLIENT.name, CFG.placementFee, "Received, non-refundable");
      break;
    }
    case "ftagain": state.placement = null; c.screen = "home"; break;
    case "ftfee": state.ftFee = !state.ftFee; toast(state.ftFee ? "Placement fee collection is on." : "Placement fee collection is off."); break;
  }
  render();
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]"); if (t && !t.disabled) act(t.dataset.act, t.dataset.v);
});
document.addEventListener("input", (e) => {
  const id = e.target.id, c = state.cust;
  if (id === "addr") c.address = e.target.value;
  if (id === "notes") c.notes = e.target.value;
  if (id === "sptext") c.specialText = e.target.value;
  if (id === "ftnotes") c.ft.notes = e.target.value;
});
document.addEventListener("change", (e) => {
  const id = e.target.id; if (!id || !id.startsWith("cfg-")) return;
  const n = Number(e.target.value);
  if (!Number.isFinite(n) || n < 0) { toast("Enter a number."); render(); return; }
  if (id.startsWith("cfg-rate-")) RATE[id.slice(9)] = n;
  else if (id.startsWith("cfg-pk-")) CFG.packages[Number(id.slice(7))] = n;
  else CFG[id.slice(4)] = n;
  toast("Saved. The apps use the new figure straight away.");
  render();
});

/* ---------- guide ---------- */
function guide() {
  const b = state.booking;
  const g = (n, text, go, label) => `<div class="guide"><span class="step">Step ${n} of 6</span><span><b>${text}</b></span>${go ? `<button class="btn ghost small" data-act="gofloat">${label}</button>` : ""}</div>`;
  if (!b) return g(1, "In the customer phone, choose a worker (nearest first) and send a request. Tap the plan badge to try Membership.");
  if (b.status === "declined") return g(2, "The worker declined. Choose another worker in the customer phone.");
  if (b.status === "awaiting") return g(2, "In the worker phone, accept or decline. A worker needs enough job credit to cover the job's value.");
  if (b.status === "enroute") return g(3, "The worker is on the way. The customer follows the distance and arrival time live.");
  if (b.status === "arrived") return g(4, "The worker has arrived. In the worker phone, tap Check in. The app checks the worker is at the client's address.");
  if (b.status === "inprogress") return g(5, "Visit in progress. In the worker phone, tap Check out. That counts the job and uses its value from the worker's job credit. Or try the auto-complete button.");
  return g(6, "Job counted. The customer pays the worker directly. Open the job credit ledger and transactions in Admin, and try Settings.", "float", "Open credit ledger");
}

/* ---------- admin ---------- */
const STATUS_TXT = { awaiting: "Awaiting worker", enroute: "On the way", arrived: "Arrived", inprogress: "In progress", done: "Completed", declined: "Declined" };
const STATUS_CLS = { awaiting: "amber", enroute: "", arrived: "ok", inprogress: "ok" };
const SIGN = { "Credit top-up": 1, Membership: 1, "Placement fee": 1, "Credit used": 0, Reversal: 0, "Membership refund": -1 };
const TX_TYPES = ["Credit top-up", "Credit used", "Placement fee", "Membership", "Membership refund", "Reversal"];
const TXH = ["Time", "Reference", "Type", "Party", "Amount", "Status"];
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
const tbl = (head, rows, empty) => rows.length ? `<div class="tbl"><table><thead><tr>${head.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>` : `<p class="muted">${empty || "Nothing here yet."}</p>`;
const who = (name, sub) => `<b>${esc(name)}</b><div class="small muted">${esc(sub)}</div>`;
const sumBy = (a, f) => a.reduce((s, x) => s + f(x), 0);
const floatStatus = (w) => busyIds().has(w.id) ? ["amber", "On a job"] : state.float[w.id] < CFG.minListed ? ["red", "Paused: low credit"] : state.float[w.id] < CFG.lowCredit ? ["amber", "Low credit"] : ["ok", "Available"];

function liveJob() {
  const b = state.booking; if (!b || b.status === "declined" || b.status === "done") return null;
  const w = worker(b.wid), c = AREAS[DEMO_CLIENT.area], ws = AREAS[w.area];
  const p = b.status === "awaiting" ? 0 : b.status === "enroute" && state.track ? 1 - state.track.d / state.track.d0 : 1;
  const note = { awaiting: "Waiting for the worker", enroute: state.track ? state.track.d.toFixed(1) + " km away" : "", arrived: "At the address", inprogress: "Checked in" }[b.status];
  return { id: "B-2051", wid: b.wid, client: DEMO_CLIENT.name, cphone: DEMO_CLIENT.phone, service: b.service, status: b.status, area: DEMO_CLIENT.area, note, hours: b.hours, price: b.price, c, w: lerp(ws, c, p) };
}
const activeJobs = () => [liveJob(), ...state.active].filter(Boolean);
const customers = () => [{ ...DEMO_CLIENT, tier: state.member, jobs: state.booking ? 1 : 0 }, ...CUSTOMERS];
function ledger() {
  const sumT = (types) => state.tx.filter((x) => types.includes(x.type)).reduce((s, x) => s + x.amt, 0);
  const used = r2(sumT(["Credit used"]) - sumT(["Reversal"])), pct = CFG.creditPct / 100;
  const membership = r2(sumT(["Membership"]) - sumT(["Membership refund"]));
  const earned = r2(used * pct);
  return { outstanding: r2(sumBy(Object.values(state.float), (v) => v)), topups: r2(sumT(["Credit top-up"])), used, earned, placement: r2(sumT(["Placement fee"])), membership, income: r2(earned + sumT(["Placement fee"]) + membership) };
}
function txRow(x) {
  const sg = SIGN[x.type];
  const cls = sg > 0 ? "amt-in" : sg < 0 ? "amt-out" : "muted";
  const pc = x.type === "Membership refund" ? "red" : x.type === "Credit top-up" ? "ok" : x.type === "Placement fee" ? "amber" : x.type === "Reversal" ? "amber" : "";
  return `<tr><td>${x.t}</td><td>${esc(x.ref)}</td><td><span class="pill ${pc}">${x.type}</span></td><td>${esc(x.party)}</td><td class="${cls}">${sg < 0 ? "−" : sg > 0 ? "+" : ""}${K(x.amt)}</td><td>${x.status}</td></tr>`;
}
function adminNav(counts) {

  const done = state.jobs.map((j) => {
    const st = j.status === "reversed" ? ["amber", "Completed · credit returned"] : ["ok", "Completed · counted"];
    return `<tr><td><b>${j.id}</b></td><td>${esc(j.client)}</td><td>${j.worker}</td><td>${LABEL[j.service]}</td><td>${j.hours} h</td><td>${K(j.price)}</td><td>${j.status === "reversed" ? "—" : K(j.price)}</td><td><span class="pill ${st[0]}">${st[1]}</span></td></tr>`;
  });
  const live = act2.map((j) => `<tr><td><b>${j.id}</b></td><td>${esc(j.client)}</td><td>${worker(j.wid).name}</td><td>${LABEL[j.service]}</td><td>${j.hours} h</td><td>${K(j.price)}</td><td>—</td><td><span class="pill ${STATUS_CLS[j.status] || ""}">${STATUS_TXT[j.status]}</span></td></tr>`);
  const declined = `<tr><td><b>B-2039</b></td><td>Peter Sakala</td><td>Bwalya Tembo</td><td>Housekeeper</td><td>3 h</td><td>${K(135)}</td><td>—</td><td><span class="pill red">Declined</span></td></tr>`;
  return `<div class="panel"><h3>All bookings</h3><p class="small muted" style="margin-bottom:10px">The final charge is paid by the customer to the worker. The same value is used from the worker's job credit when the job is counted at check-out.</p>${tbl(["Job", "Client", "Worker", "Service", "Length", "Final charge", "Credit used", "Status"], [...live, ...done, declined])}</div>`;
}

function secFloat({ M, paused }) {
  const rows = [...WORKERS].sort((a, b) => state.float[a.id] - state.float[b.id]).map((w) => {
    const st = floatStatus(w), n = state.jobs.filter((j) => j.wid === w.id).length;
    return `<tr><td>${who(w.name, WPHONE[w.id])}</td><td><b>${K(state.float[w.id])}</b></td><td><span class="pill ${st[0]}">${st[1]}</span></td><td>${n}</td></tr>`;
  });
  return `<div class="tiles"><div class="tile"><div class="v">${K(M.outstanding)}</div><div class="l">Job credit outstanding</div></div><div class="tile"><div class="v">${K(M.topups)}</div><div class="l">Received from top-ups</div></div><div class="tile"><div class="v">${K(M.used)}</div><div class="l">Job credit used</div></div><div class="tile"><div class="v">${paused.length}</div><div class="l">Workers paused (low credit)</div></div></div>
    <div class="panel"><h3>Worker job credit</h3><p class="small muted" style="margin-bottom:10px">A worker buys job credit, for example ${K0(CFG.packages[1])} of jobs for ${K0(topupPrice(CFG.packages[1]))}. Each counted job uses its value from the credit. A worker below ${K0(CFG.minListed)} cannot accept jobs and is hidden from customers. Staff can return credit, because it is HomeTrust's own record. All figures are set under Settings.</p>
      ${tbl(["Worker", "Job credit", "Status", "Jobs counted"], rows)}</div>`;
}

function secTx() {
  const f = state.txf, rows = state.tx.filter((x) => f === "all" || x.type === f);
  const chips = ["all", ...TX_TYPES].map((t) => `<button class="chip" data-act="txf" data-v="${t}" aria-pressed="${f === t}">${t === "all" ? "All" : t}</button>`).join("");
  return `<div class="panel"><h3>Transaction history</h3><p class="small muted" style="margin-bottom:10px">HomeTrust's own money only: credit top-ups, placement fees, memberships and refunds. "Credit used" and "Reversal" rows record job credit and are not cash. Job payments go straight from customer to worker and never appear here.</p>
    <div class="chips" style="margin-bottom:12px" role="group" aria-label="Filter by type">${chips}</div>${tbl(TXH, rows.map(txRow), "No transactions of this type yet.")}
    <p class="small muted" style="margin-top:10px">${rows.length} ${rows.length === 1 ? "entry" : "entries"}</p></div>`;
}

function secWorkers() {
  const rows = WORKERS.map((w, i) => { const st = floatStatus(w); return `<tr><td>${who(w.name, WPHONE[w.id])}</td><td>${w.services.map((s) => LABEL[s]).join(", ")}</td><td>${w.area}</td><td>★ ${w.rating} · ${w.jobs} jobs</td>
    <td><div class="checks">${CHECKS.map((c) => `<span class="pill ok" title="${c}">✓</span>`).join("")}</div></td>
    <td>${i === 3 ? (state.photoPending ? `<span class="pill amber">New photo waiting</span> <button class="btn small" data-act="photo" data-v="ok">Approve</button> <button class="btn ghost small" data-act="photo" data-v="no">Reject</button>` : `<span class="pill ${state.photoDone === "ok" ? "ok" : "red"}">${state.photoDone === "ok" ? "Approved" : "Rejected"}</span>`) : `<span class="pill ok">Approved</span>`}</td>
    <td>${K(state.float[w.id])}</td><td><span class="pill ${st[0]}">${st[1]}</span></td></tr>`; });
  return `<div class="panel"><h3>Workers</h3><p class="small muted" style="margin-bottom:10px">A worker is listed to customers only when all six checks are cleared and their job credit is above the minimum: ${CHECKS.join(", ")}. A changed profile photo needs approval first.</p>
    ${tbl(["Worker", "Services", "Area", "Rating", "Six checks", "Profile photo", "Job credit", "Now"], rows)}</div>`;
}

function secCustomers() {
  const rows = customers().map((c) => `<tr><td>${who(c.name, c.phone)}</td><td>${c.area}</td><td><span class="pill ${c.tier === "basic" ? "" : "ok"}">${c.tier === "basic" ? "Basic" : "★ " + PLANS[c.tier].name}</span></td><td>${LIMIT[c.tier] === Infinity ? "All" : "Nearest " + LIMIT[c.tier]}</td><td>${c.jobs}</td></tr>`);
  return `<div class="panel"><h3>Customers</h3>${tbl(["Customer", "Area", "Plan", "Workers shown", "Bookings"], rows)}</div>`;
}

function secComplaints({ openC }) {
  const rows = state.complaints.map((c) => {
    const job = state.jobs.find((j) => j.id === c.job);
    return `<tr><td><b>${c.id}</b></td><td><span class="pill ${c.type === "SOS" ? "red" : "amber"}">${c.type}</span></td><td>${c.job}</td><td>${esc(c.client)}</td><td>${esc(c.worker)}</td><td>${esc(c.text)}</td>
    <td>${c.status === "open" ? `<span class="pill red">Open</span>` : `<span class="pill ok">Resolved</span>`}</td>
    <td>${c.status === "open" ? `<button class="btn small" data-act="resolve" data-v="${c.job}">Resolve</button> ` : ""}${job && job.status === "counted" ? `<button class="btn ghost small" data-act="reverse" data-v="${c.job}">Return ${K(job.price)} credit</button>` : job && job.status === "reversed" ? `<span class="small muted">Credit returned</span>` : ""}</td></tr>`; });
  return `<div class="panel"><h3>Complaints and SOS (${openC.length} open)</h3><p class="small muted" style="margin-bottom:10px">HomeTrust records the complaint, mediates, and can warn or suspend the worker. It cannot refund a job payment, because the customer paid the worker directly. Job credit used for a job can be returned, because it is HomeTrust's own record.</p>
    ${tbl(["ID", "Type", "Job", "Client", "Worker", "Details", "Status", "Action"], rows, "No complaints.")}</div>`;
}

const placementsAll = () => [state.placement, ...state.placements].filter(Boolean);
function secPlacements() {
  const all = placementsAll(), fees = sumBy(state.tx.filter((x) => x.type === "Placement fee"), (x) => x.amt);
  const label = (p) => ({ hired: ["ok", "Hired"], accepted: ["amber", "Worker accepted"], offered: ["amber", "Offered to worker"], shortlist: ["amber", "Shortlist sent"], requested: ["amber", "New request"] }[p.status]);
  const rows = all.map((p) => `<tr><td><b>${p.id}</b></td><td>${esc(p.client)}</td><td>${LABEL[p.role]} · ${p.arrangement}</td><td>${p.start}</td><td>${p.picked ? who(worker(p.picked).name, WPHONE[p.picked]) : "Not chosen yet"}</td>
    <td><span class="pill ${label(p)[0]}">${label(p)[1]}</span></td>
    <td>${p.status === "requested" ? `<button class="btn small" data-act="ftshort" data-v="${p.id}">Send shortlist</button>` : p.status === "hired" ? (p.feePaid ? K(CFG.placementFee) + " received" : "No fee charged") : ""}</td></tr>`);
  return `<div class="tiles"><div class="tile"><div class="v">${all.length}</div><div class="l">Placement requests</div></div><div class="tile"><div class="v">${all.filter((p) => p.status === "hired").length}</div><div class="l">Hires confirmed</div></div><div class="tile"><div class="v">${K(fees)}</div><div class="l">Placement fees received</div></div></div>
    <div class="panel"><div class="row" style="align-items:flex-start"><div><h3>Placement fee</h3><p class="small muted">${K(CFG.placementFee)} paid once by the employer, non-refundable, after the worker accepts and the employer confirms. Workers are never charged and no job credit is used for full-time workers. Switch collection off until the legal check on the placement model is done. The amount is set under Settings.</p></div>
      <button class="btn small ${state.ftFee ? "" : "ghost"}" data-act="ftfee" aria-pressed="${state.ftFee}">${state.ftFee ? "Collection: On" : "Collection: Off"}</button></div></div>
    <div class="panel" style="margin-top:16px"><h3>Full-time placement requests</h3>${tbl(["ID", "Employer", "Role", "Start", "Worker", "Status", ""], rows)}</div>`;
}

function secMembers() {
  const cs = customers(), mem = cs.filter((c) => c.tier !== "basic");
  const count = (t) => cs.filter((c) => c.tier === t).length;
  const mrr = sumBy(mem, (c) => PLANS[c.tier].price);
  const rows = mem.map((c) => `<tr><td>${who(c.name, c.phone)}</td><td><span class="pill ok">★ ${PLANS[c.tier].name}</span></td><td>${K(PLANS[c.tier].price)}</td></tr>`);
  return `<div class="tiles"><div class="tile"><div class="v">${mem.length}</div><div class="l">Paying members</div></div><div class="tile"><div class="v">${K(mrr)}</div><div class="l">Membership revenue per month</div></div><div class="tile"><div class="v">${cs.length - mem.length}</div><div class="l">Basic (free) accounts</div></div></div>
    <div class="plans">${Object.entries(PLANS).map(([k, p]) => `<div class="plan"><div class="row"><b>${p.name}</b><span class="pill ok">Active</span></div><div class="pr">${p.price ? "K" + p.price : "Free"}<span class="small muted">${p.price ? " / month" : ""}</span></div><ul>${p.perks.map((x) => `<li>${x}</li>`).join("")}</ul><div class="small muted">${count(k)} ${count(k) === 1 ? "customer" : "customers"}</div></div>`).join("")}</div>
    <div class="panel" style="margin-top:16px"><h3>Members</h3>${tbl(["Customer", "Plan", "Monthly fee"], rows, "No paying members yet.")}</div>
    <p class="small muted" style="margin-top:10px">Membership is optional. A member sees more workers to choose from, still nearest first. Members can cancel for a refund within ${CFG.refundDays} days. Prices, limits and the refund window are set under Settings.</p>`;
}

function secSettings() {
  const f = (id, label, val, hint) => `<div><label class="lbl" for="${id}">${label}</label><input type="number" min="0" step="any" id="${id}" value="${val}">${hint ? `<div class="small muted">${hint}</div>` : ""}</div>`;
  return `<div class="panel"><h3>Settings</h3><p class="small muted">Every figure below can be changed here, and the apps use the new value straight away. Customers never see hourly rates, only the final charge. Change a value and press Tab or click away to save.</p></div>
    <div class="panel" style="margin-top:16px"><h3>Hourly rates (staff and workers only)</h3><div class="cfg">${Object.keys(RATE).map((s) => f("cfg-rate-" + s, LABEL[s] + " per hour (K)", RATE[s])).join("")}</div></div>
    <div class="panel" style="margin-top:16px"><h3>Job credit (float)</h3><div class="cfg">${f("cfg-creditPct", "Price of job credit (%)", CFG.creditPct, CFG.creditPct + "% means " + K0(1000 * CFG.creditPct / 100) + " buys K1,000 of jobs")}${CFG.packages.map((p, i) => f("cfg-pk-" + i, "Package " + (i + 1) + " (K of job credit)", p, "Costs " + K0(topupPrice(p)))).join("")}${f("cfg-minListed", "Minimum credit to be listed (K)", CFG.minListed)}${f("cfg-lowCredit", "Low-credit warning below (K)", CFG.lowCredit)}</div></div>
    <div class="panel" style="margin-top:16px"><h3>Bookings</h3><div class="cfg">${f("cfg-minHours", "Minimum booking (hours)", CFG.minHours)}${f("cfg-autoMinutes", "Count the job automatically after the booked end time (minutes)", CFG.autoMinutes)}</div></div>
    <div class="panel" style="margin-top:16px"><h3>Memberships</h3><div class="cfg">${f("cfg-plusPrice", "Plus price per month (K)", CFG.plusPrice)}${f("cfg-premiumPrice", "Premium price per month (K)", CFG.premiumPrice)}${f("cfg-limBasic", "Workers shown to Basic", CFG.limBasic)}${f("cfg-limPlus", "Workers shown to Plus", CFG.limPlus)}${f("cfg-refundDays", "Refund window (days)", CFG.refundDays)}</div></div>
    <div class="panel" style="margin-top:16px"><h3>Full-time placement</h3><div class="cfg">${f("cfg-placementFee", "Placement fee (K, non-refundable)", CFG.placementFee)}</div><p class="small muted" style="margin-top:8px">Switch collection on or off under Full-time placements.</p></div>`;
}

/* ---------- website ---------- */
function websiteView() {
  return `<section class="hero"><div><h1>Verified help for your home in Lusaka.</h1>
      <p class="lead">Nannies, babysitters, cleaners, cooks and housekeepers who have passed six checks. See who is available nearest to you, book, and follow them to your door.</p>
      <div class="cta"><button class="btn" data-act="cta">Get it on Google Play</button><button class="btn ghost" data-act="tab" data-v="apps">Try the prototype</button></div></div>
    <div class="hero-card" aria-hidden="true"><div class="row"><span>Mwila Chanda · Cleaner</span><b>0.8 km</b></div><div class="row"><span>Memory Sichone · Cleaner</span><b>1.2 km</b></div><div class="row"><span>Beatrice Daka · Cleaner</span><b>2.8 km</b></div><p class="small" style="opacity:.85">Available workers, nearest first.</p></div></section>
    <section class="sec"><h2>How it works</h2><p class="intro">Three steps, and you can see everything on your phone.</p><div class="grid3">
      <div class="panel"><h3>1. Choose</h3><p class="muted">Pick a service and see verified, available workers nearest first, with their rating.</p></div>
      <div class="panel"><h3>2. Book</h3><p class="muted">Set the time and how long, and add instructions. You see one final charge before you send, and the worker accepts.</p></div>
      <div class="panel"><h3>3. Follow arrival</h3><p class="muted">See the worker's distance and arrival time. You pay the worker directly when the visit ends.</p></div></div></section>
    <section class="sec"><h2>Six checks before anyone is listed</h2><p class="intro">HomeTrust does every check. Interviews and skills assessments are done through WhatsApp or in person.</p><div class="grid3">
      ${CHECKS.map((c, i) => `<div class="panel"><h3>${c}</h3><p class="muted">${["A clear photo of the worker and their NRC.", "Previous employers are contacted.", "Certificate checked and renewed every 12 months.", "Certificate checked and renewed every 12 months.", "A practical assessment of the work they will do.", "Conduct, language and expectations."][i]}</p></div>`).join("")}</div></section>
    <section class="sec"><h2>Work with HomeTrust</h2><p class="intro">Registering is free. Customers pay you directly. You buy job credit from HomeTrust, for example ${K0(CFG.packages[1])} of jobs for ${K0(topupPrice(CFG.packages[1]))}, and each completed job uses its value from your credit.</p><div class="grid3">
      <div class="panel"><h3>Free to register</h3><p class="muted">No subscription and no charge to apply.</p></div>
      <div class="panel"><h3>Keep what you earn</h3><p class="muted">The customer pays you the full price. Your job credit only tracks the work you have taken.</p></div>
      <div class="panel"><h3>Your photo is you</h3><p class="muted">A profile photo must show you. Any change is approved by HomeTrust.</p></div></div></section>
    <section class="sec"><h2>One clear price</h2><p class="intro">You see one final charge before you send a request. You pay it to the worker directly, and HomeTrust adds no booking fee.</p><div class="grid3">
      <div class="panel"><h3>Final charge</h3><p class="muted">Shown for the length of booking you choose, before you confirm.</p></div>
      <div class="panel"><h3>Minimum ${CFG.minHours} hours</h3><p class="muted">Every booking is at least ${CFG.minHours} hours, so the worker's time is worthwhile.</p></div>
      <div class="panel"><h3>No booking fee</h3><p class="muted">HomeTrust does not take payment for the job or add a fee to it.</p></div></div></section>
    <section class="sec"><h2>Optional membership</h2><p class="intro">Everyone starts on Basic for free. Members see more available workers to choose from. Membership does not include free labour, and you still pay the worker for each job. Cancel within ${CFG.refundDays} days for a refund.</p><div class="plans">
      ${Object.values(PLANS).map((p) => `<div class="plan"><b>${p.name}</b><div class="pr">${p.price ? "K" + p.price : "Free"}<span class="small muted">${p.price ? " / month" : ""}</span></div><ul>${p.perks.map((x) => `<li>${x}</li>`).join("")}</ul></div>`).join("")}</div></section>
    <section class="sec"><h2>Safety built in</h2><div class="grid3">
      <div class="panel"><h3>Location only for the job</h3><p class="muted">Shared during a booking and checked at arrival.</p></div>
      <div class="panel"><h3>SOS and complaints</h3><p class="muted">Reach HomeTrust from the app. HomeTrust records and follows up, and can suspend a worker.</p></div>
      <div class="panel"><h3>Private documents</h3><p class="muted">Only authorised staff see a worker's documents. Your address is shared after acceptance.</p></div></div></section>
    <section class="sec"><div class="panel" style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between"><div><h2 style="margin-bottom:6px">Looking for a full-time worker?</h2><p class="muted">Tell us the role. HomeTrust acts as your agent and shortlists verified workers. You pay a one-off, non-refundable placement fee when you confirm the hire.</p></div><button class="btn" style="width:auto" data-act="cta">Request a placement in the app</button></div></section>
    <footer class="footer"><p>HomeTrust Zambia. Prototype with sample workers, rates and prices.</p></footer>`;
}

/* ---------- render ---------- */
function postRender() {
  document.querySelectorAll(".map").forEach((m) => {
    const path = m.querySelector(".route"), dot = m.querySelector(".wdot");
    if (!path || !dot) return;
    const p = path.getPointAtLength(path.getTotalLength() * Number(dot.dataset.p));
    dot.setAttribute("cx", p.x); dot.setAttribute("cy", p.y);
  });
}
function render() {
  const v = $("#view");
  const active = document.activeElement && document.activeElement.id;
  const caret = active && document.activeElement.selectionStart;
  v.innerHTML = state.tab === "website" ? websiteView() : state.tab === "apps" ? `${guide()}<div class="apps">${customerPhone()}${workerPhone()}${sidePanel()}</div>` : adminView();
  ["website", "apps", "admin"].forEach((t) => $("#t-" + t).setAttribute("aria-current", String(state.tab === t)));
  postRender();
  if (active && ["INPUT", "TEXTAREA"].includes((document.getElementById(active) || {}).tagName) && !timer && !active.startsWith("cfg-")) {
    const el = document.getElementById(active); if (el) { el.focus(); try { el.setSelectionRange(caret, caret); } catch (e) {} }
  }
}
state = fresh();
render();
</script>

</body>
</html>
